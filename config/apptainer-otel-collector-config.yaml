# https://opentelemetry.io/docs/collector/configuration/

receivers:
  otlp: # [^1]
    protocols:
      grpc:
        endpoint: localhost:4317

processors:
  batch:

exporters:
  otlphttp/prometheus: # [^2]
    endpoint: "http://localhost:9090/api/v1/otlp" # [^3]
  # Forward OTLP traces from boom apps to Tempo (gRPC OTLP, no TLS on the
  # shared Apptainer localhost). Tempo listens on 4319 to avoid colliding with
  # this collector's own OTLP receiver on 4317.
  otlp/tempo:
    endpoint: localhost:4319
    tls:
      insecure: true
  debug:
    verbosity: detailed

extensions:
  health_check:
    endpoint: localhost:13133
  zpages:
    endpoint: localhost:55679

service:
  extensions: [health_check, zpages]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: localhost
                port: 8888
                without_type_suffix: true
                without_units: true
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]

# [^1]: https://github.com/open-telemetry/opentelemetry-collector/tree/main/receiver/otlpreceiver

# [^2]:
#   * https://prometheus.io/docs/guides/opentelemetry/#send-opentelemetry-metrics-to-the-prometheus-server
#   * https://github.com/open-telemetry/opentelemetry-collector/blob/main/exporter/otlphttpexporter
#
#   The Prometheus OTLP receiver requires HTTP and protobuf, so use the otlphttp
#   exporter (which encodes as proto by default).

# [^3]: https://prometheus.io/docs/guides/opentelemetry/#enable-the-otlp-receiver
